name: 云TV盒子Whitebox云编译

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: 构建云TV盒子 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 获取 whitebox OEM 源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Python 3.8 构建环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 配置 Android SDK 路径
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 生成本次发布签名
        shell: bash
        run: |
          set -euo pipefail
          export KEYSTORE_PATH="$RUNNER_TEMP/whitebox-release.jks"
          export KEYSTORE_PASSWORD="whitebox-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias whitebox \
            -keypass "$KEYSTORE_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=whitebox, OU=Yunconnect, O=Yunconnect, L=Shenzhen, ST=Guangdong, C=CN"
          cat > app/ci-signing.gradle <<'EOF'
          android {
              signingConfigs {
                  ciRelease {
                      storeFile file(System.getenv('KEYSTORE_PATH'))
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias 'whitebox'
                      keyPassword System.getenv('KEYSTORE_PASSWORD')
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ciRelease
                  }
              }
          }
          EOF
          echo "apply from: 'ci-signing.gradle'" >> app/build.gradle
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"

      - name: 编译 Python 32 位与 64 位 Release APK
        working-directory: .
        run: |
          set -euo pipefail
          chmod +x gradlew
          PYTHON_BUILD_EXECUTABLE="${pythonLocation}/bin/python" \
            ./gradlew :app:assemblePython32Release :app:assemblePython64Release --build-cache --parallel --daemon --warning-mode all

      - name: 准备 Python 双架构发布包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/python32/release/whitebox_release-python32.apk \
            dist/whitebox_云TV盒子_Python32_armeabi-v7a.apk
          cp app/build/outputs/apk/python64/release/whitebox_release-python64.apk \
            dist/whitebox_云TV盒子_Python64_arm64-v8a.apk
          ls -lh dist

      - name: 上传云TV盒子 Python 双架构 APK
        uses: actions/upload-artifact@v4
        with:
          name: 云TV盒子_Python_32_64_APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
