name: 云TV影视 Whitebox 云编译

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: 构建云TV影视 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 获取 whitebox OEM 源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Python 3.8 构建环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 配置 Android SDK 路径
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 编译 Python 32 位与 64 位 Release APK
        working-directory: .
        run: |
          set -euo pipefail
          chmod +x gradlew
          PYTHON_BUILD_EXECUTABLE="${pythonLocation}/bin/python" \
            ./gradlew :app:assemblePython32Release :app:assemblePython64Release --build-cache --parallel --daemon --warning-mode all

      - name: 整理原始未签名 Python 双架构 APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/python32/release/whitebox_release-python32.apk \
            dist/whitebox_云TV影视_Python32_armeabi-v7a_unsigned.apk
          cp app/build/outputs/apk/python64/release/whitebox_release-python64.apk \
            dist/whitebox_云TV影视_Python64_arm64-v8a_unsigned.apk
          ls -lh dist
      - name: 上传云TV影视 Python 双架构 APK
        uses: actions/upload-artifact@v4
        with:
          name: 云TV影视_Python_32_64_原始未签名_APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
