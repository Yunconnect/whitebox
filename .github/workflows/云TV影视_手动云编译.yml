name: 云TV影视 Whitebox 云编译

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: 构建云TV影视 Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 获取 whitebox OEM 源码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 安装 Python 3.8 构建环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: 配置 Android SDK 路径
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: 恢复稳定发布签名与完整性指纹
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WHITEBOX_HARDENING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WHITEBOX_HARDENING_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WHITEBOX_HARDENING_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WHITEBOX_HARDENING_KEY_ALIAS }}
          RELEASE_CERT_SHA256: ${{ secrets.WHITEBOX_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$RELEASE_CERT_SHA256"
          export KEYSTORE_PATH="$RUNNER_TEMP/whitebox-hardened-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          cat > app/ci-signing.gradle <<'EOF'
          android {
              signingConfigs {
                  ciRelease {
                      storeFile file(System.getenv('KEYSTORE_PATH'))
                      storePassword System.getenv('KEYSTORE_PASSWORD')
                      keyAlias System.getenv('KEY_ALIAS')
                      keyPassword System.getenv('KEY_PASSWORD')
                      v1SigningEnabled true
                      v2SigningEnabled true
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.ciRelease
                  }
              }
          }
          EOF
          echo "apply from: 'ci-signing.gradle'" >> app/build.gradle
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "RELEASE_CERT_SHA256=$RELEASE_CERT_SHA256" >> "$GITHUB_ENV"

      - name: 编译 Python 32 位与 64 位 Release APK
        working-directory: .
        run: |
          set -euo pipefail
          chmod +x gradlew
          PYTHON_BUILD_EXECUTABLE="${pythonLocation}/bin/python" \
            ./gradlew :app:assemblePython32Release :app:assemblePython64Release --build-cache --parallel --daemon --warning-mode all

      - name: 准备 Python 双架构发布包
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/python32/release/whitebox_release-python32.apk \
            dist/whitebox_云TV影视_Python32_armeabi-v7a.apk
          cp app/build/outputs/apk/python64/release/whitebox_release-python64.apk \
            dist/whitebox_云TV影视_Python64_arm64-v8a.apk
          zipalign_bin=$(find "$ANDROID_HOME/build-tools" -type f -name zipalign -perm -111 | sort -V | tail -n 1)
          apksigner_bin=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)
          test -n "$zipalign_bin"
          test -n "$apksigner_bin"
          for apk in dist/*.apk; do
            aligned="${apk}.aligned"
            signed="${apk}.signed"
            "$zipalign_bin" -f -p 4 "$apk" "$aligned"
            "$apksigner_bin" sign \
              --ks "$KEYSTORE_PATH" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --ks-key-alias "$KEY_ALIAS" \
              --key-pass "pass:$KEY_PASSWORD" \
              --v1-signing-enabled true \
              --v2-signing-enabled true \
              --out "$signed" "$aligned"
            mv "$signed" "$apk"
            rm -f "$aligned"
            "$apksigner_bin" verify --verbose "$apk"
          done
          ls -lh dist

      - name: 上传云TV影视 Python 双架构 APK
        uses: actions/upload-artifact@v4
        with:
          name: 云TV影视_Python_32_64_APK
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
